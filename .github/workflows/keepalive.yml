# FalkorDB Cloud's free tier stops instances idle for a day; a query every 6 hours keeps the demo up.
name: keepalive
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 https://ripple-api.vercel.app/api/health
