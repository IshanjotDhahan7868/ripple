edges:
  # === AI demand → DC buildout ===
  - { from: AI_Compute_Demand, to: Data_Centers,              weight: 0.75, lag_months: 6,  confidence: 0.9, polarity:  1, why: "AI training and inference workloads require new data center capacity." }
  - { from: AI_Compute_Demand, to: Advanced_Logic_Chips,      weight: 1.00, lag_months: 3,  confidence: 0.9, polarity:  1, why: "AI workloads run on GPUs and accelerators, so compute demand drives chip sales directly." }
  - { from: AI_Compute_Demand, to: Memory_Chips,              weight: 0.80, lag_months: 6,  confidence: 0.8, polarity:  1, why: "AI accelerators need large amounts of high-bandwidth memory." }
  - { from: AI_Compute_Demand, to: AI_Networking,             weight: 0.70, lag_months: 6,  confidence: 0.8, polarity:  1, why: "Larger AI clusters need more high-speed switches and optical interconnects." }
  - { from: AI_Compute_Demand, to: AI_Cooling_and_Thermal,    weight: 0.60, lag_months: 6,  confidence: 0.8, polarity:  1, why: "Dense AI racks generate heat that requires liquid and advanced cooling." }

  # Data centers → power & kit
  - { from: Data_Centers,      to: Electricity_Demand,        weight: 0.90, lag_months: 3,  confidence: 0.9, polarity:  1, why: "Each new data center adds large, always-on electrical load." }
  - { from: Data_Centers,      to: Industrial_Construction,   weight: 0.80, lag_months: 6,  confidence: 0.8, polarity:  1, why: "Data center campuses are large construction projects." }
  - { from: Data_Centers,      to: Electrical_Equipment,      weight: 0.60, lag_months: 6,  confidence: 0.8, polarity:  1, why: "New facilities need transformers, switchgear and backup power equipment." }
  - { from: Data_Centers,      to: Power_Grid_Infrastructure, weight: 0.60, lag_months: 9,  confidence: 0.8, polarity:  1, why: "Data center load requires new transmission and interconnection capacity." }
  - { from: Data_Centers,      to: Copper,                    weight: 0.50, lag_months: 6,  confidence: 0.7, polarity:  1, why: "Data centers use copper heavily in power distribution and cabling." }
  - { from: Data_Centers,      to: AI_Cooling_and_Thermal,    weight: 0.70, lag_months: 3,  confidence: 0.9, polarity:  1, why: "Every new facility's thermal load must be removed by cooling systems." }
  - { from: Data_Centers,      to: AI_Networking,             weight: 0.60, lag_months: 6,  confidence: 0.8, polarity:  1, why: "New facilities are fitted out with switching and networking gear." }
  - { from: Data_Centers,      to: Memory_Chips,              weight: 0.50, lag_months: 6,  confidence: 0.7, polarity:  1, why: "Servers in new data centers are populated with DRAM and flash storage." }

